<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64" role="img" aria-labelledby="title description">
  <title id="title">Azúria Voice</title>
  <desc id="description">An M-shaped audio waveform in silver and blue, with a tiny black hole and tilted accretion ring at the upper right.</desc>
  <g id="audio-wave" fill="none" stroke-width="5.8" stroke-linecap="round" stroke-linejoin="round">
    <path id="silver-wave" stroke="#FFFFFF" d="M8 39h5l7-19 10 28"/>
    <path id="blue-wave" stroke="#FFFFFF" d="m30 48 9-23 8 14h9"/>
  </g>
  <g id="black-hole" transform="rotate(-24 50 14)">
    <ellipse cx="50" cy="14" rx="7.6" ry="3.1" fill="none" stroke="#FFFFFF" stroke-width="1.45"/>
    <circle id="black-hole-center" cx="50" cy="14" r="3.7" fill="#FFFFFF"/>
    <path d="M42.4 14c0 1.7 3.4 3.1 7.6 3.1s7.6-1.4 7.6-3.1" fill="none" stroke="#FFFFFF" stroke-width="1.55" stroke-linecap="round"/>
  </g>
</svg>
