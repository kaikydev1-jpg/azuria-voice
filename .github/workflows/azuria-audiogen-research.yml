name: Azúria música e SFX - evidências de modelos

# Somente leitura e anônimo: coleta metadados públicos (revisões, arquivos,
# digests, textos de licença legíveis e pacotes PyPI) dos modelos candidatos.
# Não baixa pesos, não aceita termos e não publica nada.
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-exxwck]
    paths:
      - scripts/audiogen_collect_metadata.py
      - .github/workflows/azuria-audiogen-research.yml

permissions:
  contents: read

jobs:
  collect:
    name: Coletar evidências
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 scripts/audiogen_collect_metadata.py audiogen-metadata
      - name: Trechos das licenças de uso comercial
        run: |
          cd audiogen-metadata/texts
          for f in page__stability_ai_license.txt page__stability_ai_community_license_agreement.txt page__huggingface_co_stabilityai_stable_audio_open_1_0.txt; do
            [ -f "$f" ] && { echo "=== $f"; grep -n -i -E "stable audio|commercial|revenue|1,000,000|\$1|register|affiliate|acceptable use|notice|powered by|output" "$f" | cut -c1-420 | head -45; }
          done
          for f in ACE-Step__ACE-Step-v1-3.5B__LICENSE* ace-step__ACE-Step__LICENSE; do
            [ -f "$f" ] && echo "=== $f $(wc -l < "$f") linhas, $(head -c 80 "$f" | tr '\n' ' ')"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audiogen-metadata
          path: audiogen-metadata
          retention-days: 14
      - name: Resumo
        run: cut -c1-400 audiogen-metadata/summary.txt
