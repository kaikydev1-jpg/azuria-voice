name: Azúria Voice Windows

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/azuria-windows.yml'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run full tests (keep enabled for application source changes)
        type: boolean
        default: true
      publish:
        description: Publish this version to GitHub Releases
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: azuria-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Tests (backend + frontend)
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      UV_HTTP_TIMEOUT: '120'
      UV_HTTP_RETRIES: '5'
      VOICESTUDIO_RUST_TARGET: x86_64-pc-windows-msvc
      VOICESTUDIO_UPDATE_CHANNEL: electron-stable-win32-x64
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native/desktop-bridge -> target
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.12.13'
          enable-cache: false
      - name: Bundle pinned uv
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force electron/build/uv | Out-Null
          Copy-Item -LiteralPath (Get-Command uv).Source -Destination electron/build/uv/uv-x86_64-pc-windows-msvc.exe
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install locked Python CPU test dependencies
        if: github.event_name != 'workflow_dispatch' || inputs.run_tests == true
        shell: bash
        run: bash scripts/uv-sync-retry.sh --frozen --python 3.11 --no-default-groups --group cpu --group dev
      - name: Backend and security regressions
        if: github.event_name != 'workflow_dispatch' || inputs.run_tests == true
        env:
          HF_HUB_OFFLINE: '1'
          HF_HUB_CACHE: ${{ runner.temp }}/azuria-empty-hf-cache
          OMNIVOICE_DISABLE_FILE_LOG: '1'
          PYTHONUTF8: '1'
        run: uv run --no-sync pytest backend/tests tests/test_python_security_flows.py tests/test_network_share.py tests/test_network_share_lifecycle.py tests/test_network_middleware.py tests/test_mcp_session_limits.py tests/test_dependency_security_floors.py tests/test_app_version.py tests/test_changelog_style.py tests/test_azuria_release_notes.py -q
      - name: Shared frontend unit tests
        if: github.event_name != 'workflow_dispatch' || inputs.run_tests == true
        run: bun run test:frontend
      - name: Validate Electron
        if: github.event_name != 'workflow_dispatch' || inputs.run_tests == true
        run: bun run check:electron
      - name: Build source already covered by a passing test run
        if: github.event_name == 'workflow_dispatch' && inputs.run_tests == false
        shell: pwsh
        run: |
          node scripts/validate_store_foundation.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run build:web
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node electron/tests/packaging-contract.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows installer
        id: package
        working-directory: electron
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.ELECTRON_WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.ELECTRON_WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          if (-not $env:CSC_LINK) {
            Remove-Item Env:CSC_LINK -ErrorAction SilentlyContinue
            Remove-Item Env:CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
          }
          bun x electron-builder --config electron-builder.config.mjs --win --x64 --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/packaging-contract.mjs --artifact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/update-package-contract.mjs --platform win32 --arch x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify packaged startup
        working-directory: electron
        env:
          VOICESTUDIO_SCREENSHOT: ${{ github.workspace }}/electron/release/startup.png
        run: node tests/packaged-smoke.mjs --setup
      - name: Write SHA-256 checksums
        id: checksums
        if: always() && steps.package.outcome == 'success'
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem electron/release -File | Where-Object { $_.Name -like 'Azuria-Voice-Electron-*.exe*' -or $_.Name -eq 'electron-stable-win32-x64.yml' })
          if ($assets.Count -lt 3) { throw 'Installer, blockmap and updater manifest are required.' }
          $lines = $assets | Sort-Object Name | ForEach-Object { "{0}  {1}" -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name }
          $lines | Set-Content electron/release/SHA256SUMS.txt -Encoding utf8NoBOM
      - name: Save installer, updater feed and checksums
        if: always() && steps.package.outcome == 'success' && steps.checksums.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Azuria-Voice-Windows-x64
          retention-days: 30
          if-no-files-found: error
          path: |
            electron/release/Azuria-Voice-Electron-*.exe
            electron/release/Azuria-Voice-Electron-*.exe.blockmap
            electron/release/electron-stable-win32-x64.yml
            electron/release/SHA256SUMS.txt
      - name: Save startup diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Azuria-Voice-startup-diagnostics
          path: electron/release/startup.png
          if-no-files-found: warn

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/main'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Azuria-Voice-Windows-x64
          path: release-assets
      - name: Publish the validated Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          python3 -c "import sys; from pathlib import Path; sys.path.insert(0, 'scripts'); from prepare_electron_release import release_notes; Path('release-assets/RELEASE_NOTES.md').write_text(release_notes(sys.argv[1]), encoding='utf-8')" "$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; bump the app version before publishing another update."
            exit 1
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; inspect it before publishing."
            exit 1
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Azúria Voice $VERSION" --notes-file release-assets/RELEASE_NOTES.md release-assets/*.exe release-assets/*.blockmap release-assets/*.yml release-assets/SHA256SUMS.txt
